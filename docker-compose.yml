services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: songbox
      POSTGRES_PASSWORD: songbox
      POSTGRES_DB: songbox
    ports:
      # 5433, not 5432: this machine also runs a native Windows PostgreSQL 18 service
      # (postgresql-x64-18) that wins the port-5432 race on the host's IPv4 wildcard,
      # silently shadowing this container for any localhost/127.0.0.1 client -- 5433
      # avoids the conflict entirely rather than depending on service start order.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: songbox
      MINIO_ROOT_PASSWORD: songbox-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
