name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  forbidden-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_forbidden_deps.py

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: songbox
          POSTGRES_PASSWORD: songbox
          POSTGRES_DB: songbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://songbox:songbox@localhost:5432/songbox
      APP_DATABASE_URL: postgresql+psycopg://songbox_app:songbox_app@localhost:5432/songbox
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: songbox
      MINIO_SECRET_KEY: songbox-dev-only
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=songbox -e MINIO_ROOT_PASSWORD=songbox-dev-only \
            minio/minio server /data --console-address ":9001"
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,modal]"
      - run: ruff check .
      - run: mypy app
      - run: python -m alembic upgrade head
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
