[project]
name = "songbox-api"
version = "0.1.0"
description = "Songbox API: auth, rights gate, job orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "minio>=7.2",
    "httpx>=0.27",
    "torch>=2.1,<3.0",
    "torchaudio>=2.1,<3.0",
    "demucs>=4.0",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
]
eval = [
    "datasets>=2.14",
]

[tool.setuptools]
# alembic/ has real .py files (env.py, versions/*.py) but is Alembic's own convention, not a
# package of this distribution -- Alembic reads those files directly via its CLI, never
# `import`s them through songbox_api. Without this, setuptools' flat-layout auto-discovery sees
# two top-level packages (app, alembic) and refuses to build at all.
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# torchaudio, faster-whisper, and soundfile ship no py.typed marker / stubs (unlike torch and
# demucs, which do) -- this is a third-party packaging gap, not something app code can fix.
module = ["torchaudio.*", "faster_whisper.*", "soundfile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
