repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^services/api/
      - id: ruff-format
        files: ^services/api/

  - repo: local
    hooks:
      - id: forbidden-deps
        name: no yt-dlp-class dependency
        entry: python scripts/check_forbidden_deps.py
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy-api
        name: mypy (services/api, via project venv)
        entry: python scripts/run_mypy_api.py
        language: system
        pass_filenames: false
        files: ^services/api/
